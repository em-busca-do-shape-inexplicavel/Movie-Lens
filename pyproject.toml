[project]
name = "movie-lens-recommender"
version = "0.1.0"
description = "Reproducible MovieLens recommendation system for FIAP Tech Challenge 02"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "dvc>=3.55",
    "matplotlib>=3.9",
    "mlflow>=2.18",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "torch>=2.4",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyter>=1.1",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests", "scripts", "configs"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
