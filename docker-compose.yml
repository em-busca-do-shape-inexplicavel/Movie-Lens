services:
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movie-lens-mlflow
    command: >
      mlflow server
      --backend-store-uri sqlite:////app/mlflow/mlflow.db
      --default-artifact-root /app/mlartifacts
      --host 0.0.0.0
      --port 5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/app/mlflow
      - mlflow_artifacts:/app/mlartifacts
    restart: unless-stopped

volumes:
  mlflow_data:
  mlflow_artifacts:
